[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adre"
version = "0.1.0"
description = "Agent-Driven Refactoring Engine – visual control plane + REA integration"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "ADRE Team" }
]
dependencies = [
    "PySide6>=6.6",
    "networkx>=3.2",
    "numpy>=1.26",
    "aiosqlite>=0.20",
    "pydantic>=2.6",
    "httpx>=0.27",
    "watchdog>=4.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.9",
    "ruff>=0.3",
    "pre-commit>=3.6",
    "types-networkx",
]

[project.scripts]
adre = "control_plane.ui.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["control_plane*", "rea_bridge*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
